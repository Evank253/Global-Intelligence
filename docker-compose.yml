version: "3.8"

services:
  kcn-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kcn_intelligence_os
    ports:
      - "8000:8000"
    environment:
      - KCN_ENV=production
      - LOG_LEVEL=INFO
      - VECTOR_DB_TYPE=in_memory
      - GRAPH_DB_TYPE=in_memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
