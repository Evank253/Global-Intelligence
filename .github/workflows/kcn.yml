name: KCN Validation Pipeline

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - run: |
        pip install pytest fastapi uvicorn pydantic cryptography

    - run: |
        pytest
