name: Federation audit capture (observation only)

on:
  workflow_dispatch:
  push:
    branches:
      - federation-dual-track-audit
    paths:
      - "scripts/capture-run.sh"
      - "tools/validate_federation_evidence.py"
      - "tools/annotate_environment_class.py"
      - "tools/verify_github_oidc.py"
      - ".github/workflows/federation-audit-capture.yml"

permissions:
  contents: read
  id-token: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: federation-dual-track-audit
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OIDC verifier dependency
        run: python -m pip install "PyJWT[crypto]>=2.8,<3"

      - name: Verify GitHub Actions OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python tools/verify_github_oidc.py | tee "$RUNNER_TEMP/oidc-basis.json"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "verify_github_oidc.py exited with $rc"
            exit "$rc"
          fi
          echo "MANIFEX_OIDC_BASIS_FILE=$RUNNER_TEMP/oidc-basis.json" >> "$GITHUB_ENV"

      - name: Save OIDC basis to evidence (always)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/oidc-basis.json" ]; then
            mkdir -p evidence/oidc
            cp "$RUNNER_TEMP/oidc-basis.json" evidence/oidc/oidc-basis.json
            echo "Saved OIDC verifier output to evidence/oidc/oidc-basis.json"
          else
            echo "No OIDC basis file was created."
          fi

      - name: Record GitHub Actions environment
        run: |
          echo "MANIFEX_ENVIRONMENT_CLASS=github_hosted_ci" >> "$GITHUB_ENV"
          echo "github_runner_os=$RUNNER_OS"
          echo "github_run_id=$GITHUB_RUN_ID"
          echo "github_run_attempt=$GITHUB_RUN_ATTEMPT"
          git rev-parse HEAD
          python --version
          git --version

      - name: Capture pinned real runner and validate package
        id: capture
        shell: bash
        run: |
          set +e
          bash scripts/capture-run.sh
          rc=$?
          echo "capture_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Upload captured raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: federation-audit-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/runs/**
            evidence/oidc/**
          if-no-files-found: warn
          retention-days: 90
